<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Master Mind MIDI Brain - Live Sequencer & DAW</title>
  
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --bg-main: #0a0b10;
      --bg-panel: #12141f;
      --bg-card: #181b2a;
      --border-color: #262c44;
      --accent-color: #f59e0b;
      --text-main: #f3f4f6;
      --btn-bg: #1e2235;
      --btn-border: #333a56;
    }
    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
      touch-action: none; 
    }
    html, body {
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-panel { background-color: var(--bg-panel); border-color: var(--border-color); }
    .app-card { background-color: var(--bg-card); border-color: var(--border-color); }
    .app-btn { background-color: var(--btn-bg); border-color: var(--btn-border); color: var(--text-main); }
    .app-btn-accent { background-color: var(--accent-color); color: #000 !important; font-weight: 800; }
    .app-border { border-color: var(--border-color); }
    .glow-accent { box-shadow: 0 0 12px var(--accent-color); }
    .touch-btn { touch-action: manipulation; transition: filter 0.05s ease; }
    .touch-btn:active { filter: brightness(1.25); }

    input[type=range].fader-v {
      -webkit-appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 24px;
      height: 120px;
      background: transparent;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

    .vu-segment {
      height: 4px;
      border-radius: 1px;
      background-color: #1f293d;
      transition: background-color 0.04s ease-out;
    }
    .vu-segment.lit-green { background-color: #10b981; box-shadow: 0 0 4px #10b981; }
    .vu-segment.lit-amber { background-color: #f59e0b; box-shadow: 0 0 4px #f59e0b; }
    .vu-segment.lit-red { background-color: #ef4444; box-shadow: 0 0 4px #ef4444; }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- TRANSPORT / HEADER -->
  <header class="app-panel border-b px-2 py-1 flex items-center justify-between shrink-0 h-12 min-h-[48px] max-h-[48px] z-20 overflow-hidden gap-2">
    <div class="flex items-center gap-2 shrink-0">
      <div class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-full bg-amber-500 animate-pulse" id="tempoLed"></span>
        <span class="font-black text-sm tracking-widest text-amber-500">BRAIN HW</span>
        <span class="w-2.5 h-2.5 rounded-full bg-zinc-700 transition-colors duration-75" id="midiActivityLed"></span>
      </div>

      <div class="h-6 w-px app-border mx-0.5"></div>

      <!-- MASTER MIDI IN / OUT -->
      <div class="flex items-center gap-1 app-card border p-0.5 rounded">
        <button id="btnToggleMidiIn" class="touch-btn px-2 py-0.5 rounded font-black text-xs bg-emerald-600 text-white">
          IN: <span id="lblMidiInStatus">ON</span>
        </button>
        <button id="btnToggleMidiOut" class="touch-btn px-2 py-0.5 rounded font-black text-xs bg-emerald-600 text-white">
          OUT: <span id="lblMidiOutStatus">ON</span>
        </button>
      </div>

      <div class="h-6 w-px app-border mx-0.5"></div>

      <button id="btnPlay" class="touch-btn px-3 py-1 rounded bg-emerald-600 active:bg-emerald-500 text-white font-black text-xs flex items-center gap-1 shadow">
        <span>▶</span> PLAY
      </button>
      <button id="btnStop" class="touch-btn px-2.5 py-1 rounded app-btn text-xs font-bold border">
        ■ STOP
      </button>

      <!-- BPM + TAP TEMPO -->
      <div class="flex items-center gap-1 app-card border px-1.5 py-0.5 rounded">
        <span class="text-[10px] text-zinc-400 font-bold">BPM</span>
        <button id="btnBpmMinus" class="touch-btn px-1 text-xs font-black text-amber-400 hover:text-white">-</button>
        <input id="inputBpm" type="number" min="40" max="260" value="126" class="w-12 bg-transparent text-center font-mono font-bold text-xs text-amber-400 outline-none">
        <button id="btnBpmPlus" class="touch-btn px-1 text-xs font-black text-amber-400 hover:text-white">+</button>
        <button id="btnTapTempo" class="touch-btn px-2 py-0.5 ml-1 rounded bg-amber-500 text-black font-black text-xs shadow active:scale-95">
          TAP
        </button>
      </div>

      <button id="btnQuantizeToggle" class="touch-btn text-[10px] app-btn border px-2 py-1 rounded font-bold">
        SYNC: <span id="lblQuantize" class="text-amber-400">1/16</span>
      </button>

      <button id="btnConnectMidiDirect" class="touch-btn px-2.5 py-1 rounded bg-amber-500/20 border border-amber-500 text-amber-400 font-black text-xs flex items-center gap-1">
        🔌 <span id="lblDirectMidiStatus">CONNETTI USB MIDI</span>
      </button>
    </div>

    <!-- TABS PRINCIPALI -->
    <div class="flex items-center gap-1 shrink-0">
      <div class="flex app-card p-0.5 rounded border gap-1">
        <button id="tabMixer" class="tab-btn px-3 py-1 rounded text-xs font-black app-btn-accent">MIXER</button>
        <button id="tabEditor" class="tab-btn px-3 py-1 rounded text-xs font-black text-zinc-400 hover:text-white">PIANO ROLL</button>
        <button id="tabArranger" class="tab-btn px-3 py-1 rounded text-xs font-black text-zinc-400 hover:text-white">TIMELINE & ARRANGEMENT</button>
      </div>
    </div>

    <!-- UTILITIES -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btnToggleAudio" class="touch-btn px-2 py-1 rounded text-[10px] font-bold border app-btn">
        AUDIO: <span id="lblAudioStatus" class="text-zinc-500 font-bold">OFF (MIDI ONLY)</span>
      </button>
      <button id="btnPanic" class="touch-btn px-2 py-1 rounded bg-rose-950 border border-rose-800 text-rose-300 font-black text-[10px]">
        PANIC
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main class="flex-1 relative overflow-hidden flex flex-col p-2 min-h-0">

    <!-- 1. SEZIONE MIXER CONSOLE -->
    <section id="viewMixer" class="h-full w-full flex flex-col min-h-0">
      <div class="flex justify-between items-center mb-2 shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs font-black tracking-wider uppercase text-zinc-300">Live Hardware Mixer Console</span>
          <button id="btnAddMixerSlot" class="touch-btn px-3 py-1 rounded bg-amber-500 hover:bg-amber-400 text-black text-xs font-black shadow flex items-center gap-1">
            + AGGIUNGI STRIP
          </button>
        </div>
        <div class="flex items-center gap-2 text-[10px]">
          <button id="btnUnmuteAll" class="touch-btn px-2.5 py-1 app-btn border rounded font-black hover:text-amber-400">UNMUTE ALL</button>
          <button id="btnClearSolo" class="touch-btn px-2.5 py-1 app-btn border rounded font-black hover:text-amber-400">CLEAR SOLO</button>
        </div>
      </div>
      
      <div class="flex-1 min-h-0 overflow-x-auto overflow-y-auto pb-2">
        <div id="tracksGrid" class="flex items-stretch gap-3 min-h-[460px] pb-4"></div>
      </div>
    </section>

    <!-- 2. SEZIONE PIANO ROLL -->
    <section id="viewEditor" class="h-full w-full flex-col min-h-0" style="display:none;">
      <div class="app-panel border rounded-t px-2 h-12 min-h-[48px] max-h-[48px] flex items-center justify-between shrink-0 gap-1 overflow-hidden flex-nowrap">
        <div class="flex items-center gap-1 flex-nowrap overflow-x-auto shrink min-w-0 py-1">
          <div class="flex items-center gap-1 bg-black/40 px-1.5 py-0.5 rounded border app-border shrink-0">
            <span class="text-[10px] font-bold text-zinc-400">PAT:</span>
            <span id="lblEditorPatName" class="text-xs font-black text-amber-400">A</span>
          </div>

          <div class="flex items-center gap-1 app-card border px-1.5 py-0.5 rounded shrink-0">
            <span class="text-[10px] font-bold text-zinc-400">TRK:</span>
            <input type="text" id="edTrackNameInput" class="w-20 bg-transparent text-xs font-black text-amber-400 outline-none truncate" value="Korg NTS-1">
          </div>

          <div class="flex items-center gap-1 app-card border px-1 py-0.5 rounded shrink-0">
            <input type="color" id="edTrackColorPicker" class="w-4 h-4 cursor-pointer bg-transparent border-0 rounded">
          </div>

          <div class="flex items-center gap-1 app-card border px-1.5 py-0.5 rounded shrink-0">
            <select id="edTrackMidiChSelect" class="app-btn border text-xs font-mono font-bold text-amber-400 rounded px-1 py-0.5 outline-none"></select>
          </div>

          <button id="btnEdSoloToggle" class="touch-btn px-2 py-0.5 rounded text-xs font-black border app-btn flex items-center gap-1 shrink-0">
            🎧 <span id="lblEdSolo">SOLO</span>
          </button>

          <button id="btnEdClockOnlyToggle" class="touch-btn px-2 py-0.5 rounded text-xs font-black border app-btn flex items-center gap-1 shrink-0" title="Invia solo MIDI Clock a questo canale">
            ⏱ <span id="lblEdClockOnly">CLK</span>
          </button>

          <select id="edTrackTypeSelect" class="app-btn border text-xs font-bold rounded px-1.5 py-0.5 outline-none shrink-0">
            <option value="synth">🎹 INST</option>
            <option value="drum">🥁 DRUM</option>
          </select>

          <!-- TASTO IMPORTA MIDI FILE -->
          <button id="btnTriggerImportMidi" class="touch-btn px-2 py-0.5 rounded text-[10px] font-black bg-indigo-600 hover:bg-indigo-500 text-white shrink-0 shadow flex items-center gap-1">
            📁 IMPORT MIDI
          </button>
          <input type="file" id="inputMidiFile" accept=".mid,.midi" class="hidden">

          <div class="flex items-center gap-1 bg-black/50 p-0.5 rounded border app-border shrink-0">
            <button id="btnCopyEntireTrack" class="touch-btn px-2 py-0.5 rounded text-[10px] font-black app-btn border text-cyan-400 hover:text-white">
              ⎘ COPIA TRK
            </button>
            <button id="btnPasteEntireTrack" class="touch-btn px-2 py-0.5 rounded text-[10px] font-black app-btn border text-cyan-400 hover:text-white">
              📋 INCOLLA TRK
            </button>
          </div>

          <div class="h-4 w-px app-border shrink-0 mx-0.5"></div>

          <div class="flex app-card p-0.5 rounded border gap-0.5 shrink-0">
            <button id="toolDraw" class="touch-btn px-2 py-0.5 rounded text-xs font-bold app-btn-accent">✎ DRAW</button>
            <button id="toolMove" class="touch-btn px-2 py-0.5 rounded text-xs font-bold text-zinc-400 hover:text-white">✋ MOVE</button>
            <button id="toolSelect" class="touch-btn px-2 py-0.5 rounded text-xs font-bold text-zinc-400 hover:text-white">⬚ SEL</button>
            <button id="toolEraser" class="touch-btn px-2 py-0.5 rounded text-xs font-bold text-zinc-400 hover:text-white">⌫ ERASE</button>
          </div>

          <div class="flex app-card p-0.5 rounded border gap-0.5 shrink-0">
            <button id="btnUndo" class="touch-btn px-1.5 py-0.5 rounded text-xs font-black app-btn border text-zinc-300 hover:text-amber-400" title="Undo (Ctrl+Z)">↶</button>
            <button id="btnRedo" class="touch-btn px-1.5 py-0.5 rounded text-xs font-black app-btn border text-zinc-300 hover:text-amber-400" title="Redo (Ctrl+Y)">↷</button>
            <button id="btnCopy" class="touch-btn px-1.5 py-0.5 rounded text-xs font-black app-btn border text-amber-400 hover:bg-amber-500 hover:text-black">COPY</button>
            <button id="btnPaste" class="touch-btn px-1.5 py-0.5 rounded text-xs font-black app-btn border text-amber-400 hover:bg-amber-500 hover:text-black">PASTE</button>
            <button id="btnDuplicate" class="touch-btn px-1.5 py-0.5 rounded text-xs font-black app-btn border text-amber-400 hover:bg-amber-500 hover:text-black">DUP</button>
          </div>

          <div class="flex items-center gap-1 app-card border px-1.5 py-0.5 rounded shrink-0">
            <span class="text-[10px] font-bold text-zinc-400">GT:</span>
            <select id="selNoteGate" class="app-btn border rounded px-1 py-0.5 outline-none font-mono text-[10px] font-bold text-amber-400">
              <option value="0.25">25%</option>
              <option value="0.50">50%</option>
              <option value="0.75">75%</option>
              <option value="0.90" selected>90%</option>
              <option value="1.00">100%</option>
            </select>
          </div>

          <div class="flex items-center gap-0.5 app-card border px-1 py-0.5 rounded shrink-0">
            <span class="text-[10px] font-bold text-zinc-400">LEN:</span>
            <button id="btnPatStepDec" class="touch-btn px-1 text-xs font-black app-btn border rounded text-amber-400">-</button>
            <input type="number" id="inputPatSteps" min="1" max="128" value="64" class="w-8 bg-transparent text-center font-mono font-black text-xs text-amber-400 outline-none">
            <button id="btnPatStepInc" class="touch-btn px-1 text-xs font-black app-btn border rounded text-amber-400">+</button>
          </div>

          <div class="flex items-center gap-1 app-card border px-1.5 py-0.5 rounded shrink-0">
            <button id="btnToggleSnap" class="touch-btn px-1.5 py-0.5 rounded text-[10px] font-black bg-emerald-600 text-white">
              <span id="lblSnapStatus">SNAP</span>
            </button>
            <select id="selGridRes" class="app-btn border rounded px-1.5 py-0.5 outline-none font-mono text-[10px] font-bold">
              <option value="32">1/32</option>
              <option value="16" selected>1/16</option>
              <option value="8">1/8</option>
              <option value="4">1/4</option>
            </select>
          </div>
        </div>

        <div class="flex items-center gap-1 shrink-0 pl-1 border-l app-border min-w-[185px] justify-end">
          <button id="btnEdDeselectAll" class="touch-btn px-2 py-0.5 app-btn border rounded text-[10px] text-zinc-300 font-bold opacity-0 pointer-events-none transition-opacity">DESEL</button>
          <button id="btnEdDeleteSelected" class="touch-btn px-2.5 py-0.5 bg-rose-950 border border-rose-800 rounded text-[10px] text-rose-300 font-black opacity-0 pointer-events-none transition-opacity flex items-center gap-1">
            🗑 ELIMINA
          </button>
          <button id="btnEdClear" class="touch-btn px-2 py-0.5 bg-rose-950 border border-rose-800 rounded text-[10px] text-rose-300 font-bold">CLEAR</button>
        </div>
      </div>

      <div class="flex-1 flex overflow-hidden border border-t-0 app-border min-h-0 relative">
        <div id="edTrackRail" class="w-56 flex-none app-panel border-r app-border flex flex-col overflow-y-auto shrink-0 p-1 gap-1"></div>
        
        <div class="flex-1 flex flex-col min-h-0 relative overflow-hidden">
          <div id="pianoRollWrapper" class="flex-1 relative overflow-hidden bg-black/95 min-h-0 w-full h-full">
            <canvas id="dawCanvas" class="w-full h-full block cursor-crosshair"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. SEZIONE TIMELINE & ARRANGEMENT CON SNAP MAGNETICO -->
    <section id="viewArranger" class="h-full w-full flex flex-col gap-2 min-h-0" style="display:none;">
      <div class="app-panel border rounded p-2 flex items-center justify-between shrink-0 overflow-x-auto gap-2">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs font-black tracking-wider text-amber-400 uppercase">DECK PATTERNS:</span>
          <button id="btnCreatePattern" class="touch-btn px-3 py-1 rounded app-btn-accent text-xs font-black shadow flex items-center gap-1">
            + NUOVO PATTERN
          </button>
          <button id="btnToggleSongMode" class="touch-btn px-3 py-1 rounded text-xs font-black app-btn border text-zinc-300">
            MODALITÀ: <span id="lblSongMode" class="text-amber-400 font-black">TIMELINE SONG</span>
          </button>

          <!-- Pulsanti Timeline -->
          <div class="flex items-center gap-1 bg-black/50 p-1 rounded border app-border">
            <button id="btnTimelineDup" class="touch-btn px-2 py-0.5 rounded text-[10px] font-black app-btn border text-cyan-400 hover:text-white" title="Duplica la parte selezionata">
              ⎘ DUPLICA
            </button>
            <button id="btnTimelineDelete" class="touch-btn px-2 py-0.5 rounded text-[10px] font-black bg-rose-950 border border-rose-800 text-rose-300" title="Elimina la parte selezionata">
              🗑 ELIMINA
            </button>
          </div>
        </div>

        <div class="flex items-center gap-1 text-[11px] font-mono text-zinc-300">
          <span>LUNGHEZZA SONG: <b id="lblTotalSongSteps" class="text-amber-400">0</b> STEP</span>
          <button id="btnClearTimeline" class="touch-btn px-2 py-0.5 ml-2 bg-rose-950 border border-rose-800 text-rose-300 font-black rounded text-[10px]">
            RESET TIMELINE
          </button>
        </div>
      </div>

      <!-- Scatola dei Pattern Disponibili -->
      <div class="app-card border rounded p-2 shrink-0 overflow-x-auto">
        <div id="patternsDeckContainer" class="flex items-center gap-2 min-h-[48px]"></div>
      </div>

      <!-- AREA ARRANGIAMENTO MULTITRACCIA DAW CON SNAP MAGNETICO -->
      <div class="flex-1 app-card border rounded flex flex-col min-h-0 overflow-hidden shadow-2xl">
        <div class="bg-black/50 border-b app-border px-3 py-1.5 flex justify-between items-center text-[11px] font-black uppercase text-zinc-300 shrink-0">
          <span>ARRANGIAMENTO DAW (Trascina il blocco: si aggancia all'inizio/fine delle parti vicine)</span>
          <span class="text-amber-400 font-mono text-[10px]" id="lblTimelineSelectionInfo">Nessuna parte selezionata</span>
        </div>

        <div class="flex-1 flex overflow-hidden min-h-0">
          <div id="dawTrackHeaders" class="w-48 app-panel border-r app-border flex flex-col shrink-0 overflow-y-auto"></div>

          <div id="dawArrangerTimeline" class="flex-1 flex flex-col overflow-x-auto overflow-y-auto relative bg-[#07090f]">
            <div id="timelineRuler" class="h-6 border-b app-border bg-black/60 sticky top-0 z-10 flex items-center min-w-[1400px]"></div>
            <div id="dawLanesContainer" class="flex flex-col flex-1 min-w-[1400px] relative"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="toast" class="fixed bottom-3 right-3 app-panel border border-amber-500 text-amber-400 text-xs px-3 py-1.5 rounded shadow-xl pointer-events-none opacity-0 transition-opacity duration-200 z-50"></div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    const INITIAL_TRACKS = [
      { name: "Korg NTS-1", ch: 1, type: "synth", note: 60, grp: "FREE", color: "#f59e0b", clockOnly: false, transpose: 0, vol: 100, pan: 64, sendNotes: true, sendClock: true, sendCC: true },
      { name: "Waldorf Rocket", ch: 2, type: "synth", note: 60, grp: "FREE", color: "#38bdf8", clockOnly: false, transpose: 0, vol: 100, pan: 64, sendNotes: true, sendClock: true, sendCC: true },
      { name: "TE KO-II", ch: 3, type: "drum", note: 36, grp: "FREE", color: "#f97316", clockOnly: true, transpose: 0, vol: 100, pan: 64, sendNotes: false, sendClock: true, sendCC: false },
    ];

    const DRUM_MAP_NAMES = {
      36: "BD Kick", 37: "Side Stick", 38: "SD Snare", 39: "Clap",
      40: "Snare Tight", 41: "Low Tom", 42: "Closed Hat"
